[package]
name = "app-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The generic PocketJS desktop App Shell for arbitrary app bundles"

[dependencies]
anyhow = { workspace = true }
note-widget = { path = "../note-widget" }

# No build.rs: note-widget (the linked runtime library) already embeds the
# launcher-supplied .ico (POCKETJS_ICON) as RT_ICON resources, and winresource
# links them with +whole-archive into every binary that links the library —
# including this app shell. A second embed here would duplicate every
# .rsrc leaf (VERSION/GROUP_ICON/ICON) at link time.
