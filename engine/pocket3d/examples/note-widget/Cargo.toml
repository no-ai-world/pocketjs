[package]
name = "note-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A markdown sticky note on the desktop: the first flat (2D) pocket-widget runtime"

[lib]
name = "note_widget"

[[bin]]
name = "note-widget"
path = "src/main.rs"

[build-dependencies]
# Embeds the launcher-supplied .ico (POCKETJS_ICON) as RT_ICON resources.
winresource = "0.1"

[dependencies]
pocket3d = { workspace = true }
pocket-mod = { workspace = true }
pocket-ui-wgpu = { workspace = true }
pocket-widget = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
ab_glyph = { workspace = true }
memmap2 = { workspace = true }
arboard = { workspace = true }
# Window-icon decode: .ico inputs only (PNG/BMP cover the two ICONDIR
# entry encodings); never a conversion chain.
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
